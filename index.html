<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vecteurs & droites</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout : feuille quadrillée, barre latérale de navigation + zone de travail ; onglets en bas sur téléphone */
:root{
  --bg:#F2F4F8; --grid-bg:#E3E8F1; --surface:#FFFFFF; --surface-2:#E7EBF3; --ink:#16203A; --ink-2:#56617B; --line:#D2D9E5; --grid-l:#DDE3EE;
  --vec:#3B4FD0; --vec-soft:#E1E5FB; --rep:#0B827E; --rep-soft:#D8F0EE; --col:#B85A0C; --col-soft:#F8E6D5;
  --ps:#A7377F; --ps-soft:#F6DFEE; --dr:#38812B; --dr-soft:#E0F0DA; --met:#6A45B8; --met-soft:#E9E1F7;
  --good:#257A49; --good-soft:#DCF0E3; --bad:#B9362F; --bad-soft:#F8E0DE;
  --f-head:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px; --side:250px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0F1422; --grid-bg:#161D2F; --surface:#161D2E; --surface-2:#212A3F; --ink:#E4E8F2; --ink-2:#99A3BB; --line:#2E3850; --grid-l:#28324A;
  --vec:#8C9BFF; --vec-soft:#22295A; --rep:#4FCBC4; --rep-soft:#123533; --col:#F0A458; --col-soft:#3D2810;
  --ps:#EA86C6; --ps-soft:#3E1B33; --dr:#8BD07B; --dr-soft:#1C3518; --met:#B79BF2; --met-soft:#2C2148;
  --good:#6FCB92; --good-soft:#163A26; --bad:#F08A82; --bad-soft:#43201D;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1422; --grid-bg:#161D2F; --surface:#161D2E; --surface-2:#212A3F; --ink:#E4E8F2; --ink-2:#99A3BB; --line:#2E3850; --grid-l:#28324A;
  --vec:#8C9BFF; --vec-soft:#22295A; --rep:#4FCBC4; --rep-soft:#123533; --col:#F0A458; --col-soft:#3D2810;
  --ps:#EA86C6; --ps-soft:#3E1B33; --dr:#8BD07B; --dr-soft:#1C3518; --met:#B79BF2; --met-soft:#2C2148;
  --good:#6FCB92; --good-soft:#163A26; --bad:#F08A82; --bad-soft:#43201D;
}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid-bg) 1px,transparent 1px),linear-gradient(90deg,var(--grid-bg) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:16px/1.55 var(--f-body);margin:0}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.02em}
h2{font-size:23px;font-weight:700;letter-spacing:-.01em}
h3{font-size:18px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--vec);outline-offset:2px}
.mono{font-family:var(--f-mono);font-weight:500}

/* notation vecteur : flèche au-dessus */
.vec{position:relative;display:inline-block;padding-top:.32em;line-height:1;font-weight:700;white-space:nowrap}
.vec::before{content:"";position:absolute;left:1px;right:3px;top:.1em;height:1.6px;background:currentColor}
.vec::after{content:"";position:absolute;right:0;top:calc(.1em - 3.2px);border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}

/* shell */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:22px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-head);font-size:18px;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--ink-2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:700;font-size:15px}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--ink);color:var(--bg)}
.nav svg{width:18px;height:18px;flex:none}
.side-h{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:700;margin-bottom:6px}
.side-ch{display:flex;flex-direction:column;gap:9px}
.side-ch a{text-decoration:none;display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px}
.side-ch a .bar{grid-column:1/-1}
.side-ch a span:last-of-type{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:13px}
.sync{margin-top:auto;font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);flex:none}
.sync.ok i{background:var(--good)}
main{padding:28px clamp(16px,4vw,48px) 90px;min-width:0;max-width:1100px;width:100%}
.tabs{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:20px 16px 110px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;text-decoration:none;color:var(--ink-2);padding:4px 0;border-radius:8px}
  .tabs a.on{color:var(--ink);background:var(--surface-2)}
  .tabs svg{width:20px;height:20px}
}

/* commun */
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--ink-2)}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.head p.lead{color:var(--ink-2);max-width:62ch}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink-2)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.9}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink))}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--cs,var(--surface-2));color:var(--c,var(--ink))}
.muted{color:var(--ink-2)}
.small{font-size:14px}
[data-ch="vec"]{--c:var(--vec);--cs:var(--vec-soft)}
[data-ch="rep"]{--c:var(--rep);--cs:var(--rep-soft)}
[data-ch="col"]{--c:var(--col);--cs:var(--col-soft)}
[data-ch="ps"]{--c:var(--ps);--cs:var(--ps-soft)}
[data-ch="dr"]{--c:var(--dr);--cs:var(--dr-soft)}
[data-ch="met"]{--c:var(--met);--cs:var(--met-soft)}
.empty{padding:28px;text-align:center;color:var(--ink-2);font-size:15px}

/* figures quadrillées */
.gfig{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.g-grid{stroke:var(--grid-l);stroke-width:1}
.g-ax{stroke:var(--ink-2);stroke-width:1.5}
.g-axh{fill:var(--ink-2)}
.g-t{fill:var(--ink-2);font:500 11px var(--f-mono)}
.g-pt{fill:var(--ink)}
.g-pl{fill:var(--ink);font:700 14px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.g-v{stroke:var(--k);stroke-width:2.6;stroke-linecap:round}
.g-vh{fill:var(--k)}
.g-vl{fill:var(--k);font:700 italic 14px var(--f-body);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.g-line{stroke:var(--k);stroke-width:2;fill:none}
.g-poly{fill:var(--k);fill-opacity:.1;stroke:var(--k);stroke-width:1.5;stroke-dasharray:5 4}
.g-ra{fill:none;stroke:var(--ink-2);stroke-width:1.5}

/* tableau de bord */
.dash-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;margin-bottom:28px}
@media (max-width:760px){.dash-top{grid-template-columns:1fr}}
.overall{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{width:118px;height:118px;flex:none}
.ring .bgc{stroke:var(--surface-2)} .ring .fgc{stroke:var(--vec)}
.ring text{fill:var(--ink);font-family:var(--f-head);font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 22px}
.stats b{font-family:var(--f-head);font-size:28px;font-variant-numeric:tabular-nums;line-height:1}
.stats span{font-size:13px;color:var(--ink-2)}
.next h3{margin:6px 0 4px}
.chcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:12px;margin-bottom:28px}
.chcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none}
.chcard:hover{border-color:var(--c)}
.chcard .f{font-family:var(--f-mono);color:var(--c);font-size:14px;font-weight:600}
.chcard h3{font-size:17px}
.chcard .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--ink-2);font:12px var(--f-body)}
.chart .ln{stroke:var(--vec);stroke-width:2.5;fill:none}
.chart .ar{fill:var(--vec);opacity:.1}
.chart .dt{fill:var(--surface);stroke:var(--vec);stroke-width:2}
.chart .dt.ex{fill:var(--vec)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:13px;height:13px;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--vec) 30%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--vec) 55%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--vec) 78%,var(--surface-2))}
.heat i.l4{background:var(--vec)}

/* cours */
.ch-hero{border-radius:var(--r);padding:24px;background:var(--cs);display:grid;grid-template-columns:1fr minmax(0,240px);gap:20px;align-items:center;margin-bottom:22px}
.ch-hero .f{font-family:var(--f-mono);color:var(--c);font-weight:600;font-size:16px}
.ch-hero .gfig{max-width:240px}
.ch-hero .g-pl,.ch-hero .g-vl{stroke:var(--cs)}
@media (max-width:700px){.ch-hero{grid-template-columns:1fr}.ch-hero>div:last-child{display:none}}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.toc a{font-size:14px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);text-decoration:none;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.toc a.read::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,28px);margin-bottom:16px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec h2{display:flex;gap:10px;align-items:baseline}
.sec h2 .n{font-family:var(--f-mono);font-size:14px;color:var(--c)}
.sec p,.sec li{max-width:68ch}
.sec ul,.sec ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.sec .done{align-self:flex-start}
.sec .done.on{background:var(--cs);border-color:var(--c);color:var(--c)}
.eq{font-family:var(--f-mono);background:var(--surface-2);border-radius:8px;padding:12px 16px;font-size:15.5px;overflow-x:auto;white-space:nowrap;line-height:1.9}
.eq .vec{font-family:var(--f-body)}
.callout{border-radius:8px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.callout b.t{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.callout.trap{background:var(--bad-soft);border-color:transparent}.callout.trap b.t{color:var(--bad)}
.callout.key{background:var(--cs);border-color:transparent}.callout.key b.t{color:var(--c)}
.callout.ex{background:var(--bg);border-color:transparent}.callout.ex b.t{color:var(--ink-2)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
td.m{font-family:var(--f-mono);font-size:14px;white-space:nowrap}
.fig{margin:0;display:flex;flex-direction:column;gap:6px}
.fig-sc{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.fig figcaption{font-size:13px;color:var(--ink-2)}
.props{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.props div{background:var(--bg);border-radius:8px;padding:14px;font-size:15px}
.props b{display:block;margin-bottom:4px;font-family:var(--f-head);font-size:16px}
.live{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;background:var(--bg);border-radius:8px;padding:14px}
@media (max-width:700px){.live{grid-template-columns:1fr}}
.live-in{display:flex;flex-direction:column;gap:10px}
.live-in label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-weight:700}
.live-in input{width:62px}
.live-out{display:flex;flex-direction:column;gap:8px;font-size:15px;min-width:0}
.live-out .r{font-family:var(--f-mono);font-size:14.5px}
.verdict{font-weight:700;padding:4px 10px;border-radius:99px;align-self:flex-start;font-size:14px}
.verdict.ok{background:var(--good-soft);color:var(--good)}.verdict.ko{background:var(--surface-2);color:var(--ink-2)}
.ch-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}

/* entraînement */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.fchip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink-2)}
.fchip.on{border-color:var(--c);background:var(--cs);color:var(--c)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:12px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer}
.mode:hover{border-color:var(--ink-2)}
.mode .ic{width:34px;height:34px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center}
.mode .ic svg{width:20px;height:20px}
.mode b{font-family:var(--f-head);font-size:17px}
.mode span{font-size:14px;color:var(--ink-2)}
.mode .badge{align-self:flex-start;font-size:12px;font-weight:700;font-style:normal;background:var(--bad-soft);color:var(--bad);padding:2px 8px;border-radius:99px}
.mode.feature{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mode.feature span{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.mode.feature .ic{background:color-mix(in srgb,var(--bg) 15%,transparent)}
.mode.feature .badge{background:var(--bg);color:var(--bad)}
.mode-h{margin:28px 0 12px;display:flex;align-items:center;gap:10px}
.gens{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer}
.gen:hover{border-color:var(--c)}
.gen b{font-family:var(--f-head);font-size:16px}
.gen span{font-size:13.5px;color:var(--ink-2)}
.gen .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.sess{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sess-top .t{font-family:var(--f-head);font-weight:700;font-size:18px}
.sess-top .cnt{font-variant-numeric:tabular-nums;color:var(--ink-2);font-size:14px}
.timer{font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:8px;background:var(--surface-2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px}
.qhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtext{font-family:var(--f-head);font-size:20px;font-weight:500;line-height:1.45}
.qtext .vec{font-family:var(--f-body)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:16px}
.choice:hover:not(:disabled){border-color:var(--ink-2)}
.choice kbd{font:600 12px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink-2);flex:none}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft)}
.choice:disabled{cursor:default}
.vf{flex-direction:row;flex-wrap:wrap}.vf .choice{flex:1 1 200px;justify-content:center;font-weight:700}
.ans{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:19px;font-family:var(--f-mono)}
.ans .vec{font-family:var(--f-body)}
.ans input,.live-in input{font:600 18px var(--f-mono);padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:110px;text-align:center}
.ans input:focus,.live-in input:focus{border-color:var(--vec);outline:none}
.ans input.ok{border-color:var(--good);background:var(--good-soft)}
.ans input.ko{border-color:var(--bad);background:var(--bad-soft)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.keys button{font:600 15px var(--f-mono);border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 11px;cursor:pointer}
.hint{font-size:13px;color:var(--ink-2)}
.fb{border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-soft)}.fb.ko{background:var(--bad-soft)}
.fb>b{font-family:var(--f-head);font-size:17px}
.fb.ok>b{color:var(--good)}.fb.ko>b{color:var(--bad)}
.sol{background:var(--surface);border-radius:8px;padding:12px 14px;font-size:15.5px;display:flex;flex-direction:column;gap:8px;line-height:1.7}
.sol .l{font-family:var(--f-mono);font-size:14.5px;overflow-x:auto}
.sol .l .vec{font-family:var(--f-body)}
.sol .gfig{max-width:340px}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.flash{min-height:230px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;padding:30px 22px}
.flash .front{font-family:var(--f-head);font-size:25px;font-weight:700;max-width:24ch}
.flash .back{font-size:19px;max-width:46ch;font-family:var(--f-mono);line-height:1.8}
.flash .back .vec{font-family:var(--f-body)}
.flash .hint{font-size:13px}
.res-big{display:flex;align-items:baseline;gap:10px}
.res-big b{font-family:var(--f-head);font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.brk{display:flex;flex-direction:column;gap:10px}
.brk div{display:grid;grid-template-columns:110px 1fr 60px;gap:10px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.wrong{display:flex;flex-direction:column;gap:12px}
.wrong>div{border-left:3px solid var(--bad);padding:4px 0 4px 12px;font-size:15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.wrong details summary{cursor:pointer;font-size:14px;color:var(--ink-2);font-weight:700}

/* progrès */
.skills{display:flex;flex-direction:column;gap:6px}
.skill{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;font-size:15px}
.skill .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--ink-2);flex:none;display:grid;place-items:center;margin-top:1px}
.skill.on .box{background:var(--good);border-color:var(--good)}
.skill.on .box::after{content:"";width:9px;height:5px;border-left:2.5px solid var(--surface);border-bottom:2.5px solid var(--surface);transform:rotate(-45deg) translate(1px,-1px)}
.skill.on{color:var(--ink-2)}
.hist{display:flex;flex-direction:column}
.hist div{display:grid;grid-template-columns:1fr auto auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.danger{border:1px solid var(--bad);color:var(--bad);background:transparent}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:8px;background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){
  .bar>i{transition:width .5s ease}
  .qcard,.sec{animation:rise .25s ease both}
  @keyframes rise{from{transform:translateY(6px)}to{transform:none}}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>

<script>
"use strict";
/* ================= CHAPITRES ================= */
const CH=[
  {id:"vec",name:"Fondements vectoriels & Chasles",short:"Chasles",f:"AB + BC = AC"},
  {id:"rep",name:"Repères & calcul analytique",short:"Repères",f:"(xB − xA ; yB − yA)"},
  {id:"col",name:"Colinéarité & alignement",short:"Colinéarité",f:"x·y' − x'·y = 0"},
  {id:"ps",name:"Produit scalaire & orthogonalité",short:"Produit scalaire",f:"x·x' + y·y'"},
  {id:"dr",name:"Équations de droites",short:"Droites",f:"ax + by + c = 0"},
  {id:"met",name:"Méthodes pour l’interro",short:"Méthodes",f:"AB = DC"}
];
const CHM=Object.fromEntries(CH.map(c=>[c.id,c]));

/* ================= OUTILS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dkey(new Date());
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnz=(a,b)=>{let v;do v=ri(a,b);while(v===0);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const near=(a,b,t=1e-6)=>Math.abs(a-b)<=t;

/* notation */
const V=s=>`<span class="vec">${s}</span>`;
function F(n){if(Math.abs(n-Math.round(n))<1e-9)n=Math.round(n);else n=Math.round(n*1000)/1000;return (n<0?"−":"")+String(Math.abs(n)).replace(".",",")}
const cx=k=>k===1?"":k===-1?"−":F(k);
const par=n=>n<0?`(${F(n)})`:F(n);
const C2=(x,y)=>`(${F(x)} ; ${F(y)})`;
function simp(n){let k=1,r=n;for(let i=Math.floor(Math.sqrt(n));i>=2;i--)if(n%(i*i)===0){k=i;r=n/(i*i);break}return[k,r]}
function RT(n){if(n===0)return"0";const[k,r]=simp(n);if(r===1)return F(k);return(k===1?"":F(k))+"√"+r}
function rootTxt(n){const s=Math.sqrt(n);return Number.isInteger(s)?`√${n} = ${F(s)}`:`√${n}${RT(n)!=="√"+n?" = "+RT(n):""} ≈ ${F(Math.round(s*100)/100)}`}
function term(k,v,first){if(k===0)return"";const a=Math.abs(k),s=k<0?(first?"−":" − "):(first?"":" + ");return s+(v&&a===1?"":F(a))+v}
function eqS(a,b,c){let s=term(a,"x",true);s+=term(b,"y",!s);s+=term(c,"",!s);return(s||"0")+" = 0"}
function coord(x0,d,v){if(d===0)return`${v} = ${F(x0)}`;const a=Math.abs(d);return`${v} = ${x0===0?(d<0?"−":""):F(x0)+(d<0?" − ":" + ")}${a===1?"":a+"·"}k`}
const sysS=(xa,ya,d1,d2)=>`{ ${coord(xa,d1,"x")} ; ${coord(ya,d2,"y")} }`;
function comb(a,u,b,v){const t=(k,n,f)=>{const s=k<0?(f?"−":" − "):(f?"":" + "),m=Math.abs(k);return s+(m===1?"":m)+V(n)};return t(a,u,true)+t(b,v,false)}

/* lecture d’une réponse : nombres, virgule, fractions, √ */
function parseX(raw){
  let s=String(raw||"").replace(/\s+/g,"").replace(/,/g,".").replace(/[−–]/g,"-").replace(/racine|sqrt|rac/gi,"√").replace(/[×x*]/g,"*").replace(/÷|:/g,"/");
  if(!s)return null;let i=0;
  const peek=()=>s[i];
  function expr(){let v=termP();while(peek()==="+"||peek()==="-"){const o=s[i++];const w=termP();v=o==="+"?v+w:v-w}return v}
  function termP(){let v=fac();for(;;){const c=peek();if(c==="*"||c==="/"){i++;const w=fac();v=c==="*"?v*w:v/w}else if(c==="√"||c==="("){v*=fac()}else break}return v}
  function fac(){const c=peek();
    if(c==="-"){i++;return -fac()}if(c==="+"){i++;return fac()}
    if(c==="√"){i++;return Math.sqrt(fac())}
    if(c==="("){i++;const v=expr();if(s[i]!==")")throw 0;i++;return v}
    const m=/^\d*\.?\d+/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}
  try{const v=expr();if(i!==s.length||!isFinite(v))return null;return v}catch(e){return null}
}

/* ================= FIGURES QUADRILLÉES ================= */
const KC={k1:"var(--vec)",k2:"var(--col)",k3:"var(--ps)",k4:"var(--dr)",k5:"var(--rep)",k6:"var(--met)"};
function autoR(pts,mn=6){
  let xs=[0],ys=[0];pts.forEach(p=>{xs.push(p[0]);ys.push(p[1])});
  let x0=Math.floor(Math.min(...xs))-1,x1=Math.ceil(Math.max(...xs))+1,y0=Math.floor(Math.min(...ys))-1,y1=Math.ceil(Math.max(...ys))+1;
  while(x1-x0<mn){x1++;if(x1-x0<mn)x0--}while(y1-y0<mn-2){y1++;if(y1-y0<mn-2)y0--}
  return{xr:[Math.max(x0,-16),Math.min(x1,16)],yr:[Math.max(y0,-12),Math.min(y1,12)]};
}
function G(o){
  const[x0,x1]=o.xr,[y0,y1]=o.yr,span=Math.max(x1-x0,y1-y0),u=o.u||(span>14?20:span>10?26:34),m=20;
  const W=(x1-x0)*u+2*m,H=(y1-y0)*u+2*m,X=x=>+(m+(x-x0)*u).toFixed(1),Y=y=>+(m+(y1-y)*u).toFixed(1);
  let s="";
  for(let x=x0;x<=x1;x++)s+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" class="g-grid"/>`;
  for(let y=y0;y<=y1;y++)s+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" class="g-grid"/>`;
  const step=span>12?2:1;
  if(y0<=0&&y1>=0){s+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)+8}" y2="${Y(0)}" class="g-ax"/><polygon points="${X(x1)+12},${Y(0)} ${X(x1)+4},${Y(0)-4} ${X(x1)+4},${Y(0)+4}" class="g-axh"/>`;
    for(let x=x0;x<=x1;x++)if(x&&x%step===0)s+=`<text x="${X(x)}" y="${Y(0)+14}" text-anchor="middle" class="g-t">${F(x)}</text>`}
  if(x0<=0&&x1>=0){s+=`<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)-8}" class="g-ax"/><polygon points="${X(0)},${Y(y1)-12} ${X(0)-4},${Y(y1)-4} ${X(0)+4},${Y(y1)-4}" class="g-axh"/>`;
    for(let y=y0;y<=y1;y++)if(y&&y%step===0)s+=`<text x="${X(0)-6}" y="${Y(y)+4}" text-anchor="end" class="g-t">${F(y)}</text>`;
    if(y0<=0&&y1>=0)s+=`<text x="${X(0)-6}" y="${Y(0)+14}" text-anchor="end" class="g-t">O</text>`}
  (o.polys||[]).forEach(([p,k])=>s+=`<polygon points="${p.map(q=>X(q[0])+","+Y(q[1])).join(" ")}" class="g-poly" style="--k:${KC[k]}"/>`);
  (o.lines||[]).forEach(([a,b,c,k,lab])=>{
    const P=[];const add=(x,y)=>{if(x>=x0-1e-9&&x<=x1+1e-9&&y>=y0-1e-9&&y<=y1+1e-9)P.push([x,y])};
    if(b!==0){add(x0,(-c-a*x0)/b);add(x1,(-c-a*x1)/b)}if(a!==0){add((-c-b*y0)/a,y0);add((-c-b*y1)/a,y1)}
    if(P.length<2)return;P.sort((p,q)=>p[0]-q[0]||p[1]-q[1]);const A=P[0],B=P[P.length-1];
    s+=`<line x1="${X(A[0])}" y1="${Y(A[1])}" x2="${X(B[0])}" y2="${Y(B[1])}" class="g-line" style="--k:${KC[k]}"/>`;
    if(lab)s+=`<text x="${X(B[0])-6}" y="${Y(B[1])+(B[1]>=y1-.01?16:-6)}" text-anchor="end" class="g-vl" style="--k:${KC[k]}">${lab}</text>`});
  (o.ra||[]).forEach(([cx,cy,ux,uy,vx,vy])=>{const L1=Math.hypot(ux,uy),L2=Math.hypot(vx,vy),d=.42;const a=[cx+ux/L1*d,cy+uy/L1*d],b=[cx+vx/L2*d,cy+vy/L2*d],c=[a[0]+vx/L2*d,a[1]+vy/L2*d];
    s+=`<polyline points="${X(a[0])},${Y(a[1])} ${X(c[0])},${Y(c[1])} ${X(b[0])},${Y(b[1])}" class="g-ra"/>`});
  (o.vecs||[]).forEach(([xa,ya,xb,yb,k,lab])=>{
    const A=[X(xa),Y(ya)],B=[X(xb),Y(yb)],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);if(L<1)return;
    const ux=dx/L,uy=dy/L,bx=B[0]-ux*11,by=B[1]-uy*11;
    s+=`<g style="--k:${KC[k]}"><line x1="${A[0]}" y1="${A[1]}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" class="g-v"/><polygon points="${B[0]},${B[1]} ${(bx-uy*5.5).toFixed(1)},${(by+ux*5.5).toFixed(1)} ${(bx+uy*5.5).toFixed(1)},${(by-ux*5.5).toFixed(1)}" class="g-vh"/>`;
    if(lab){const mx=(A[0]+B[0])/2-uy*13,my=(A[1]+B[1])/2+ux*13+5;s+=`<text x="${mx.toFixed(1)}" y="${my.toFixed(1)}" text-anchor="middle" class="g-vl">${lab}</text>`}
    s+="</g>"});
  (o.pts||[]).forEach(([n,x,y,pos])=>{const dx=pos==="l"?-8:8,dy=pos==="b"?18:-8;s+=`<circle cx="${X(x)}" cy="${Y(y)}" r="4" class="g-pt"/>`+(n?`<text x="${X(x)+dx}" y="${Y(y)+dy}" text-anchor="${pos==="l"?"end":"start"}" class="g-pl">${n}</text>`:"")});
  return `<svg class="gfig" viewBox="0 0 ${W+14} ${H}" role="img" aria-label="${esc(o.alt||"Figure dans un repère")}">${s}</svg>`;
}
const fig=(o,cap)=>`<figure class="fig"><div class="fig-sc">${G(o)}</div>${cap?`<figcaption>${cap}</figcaption>`:""}</figure>`;

/* ================= COURS ================= */
const callout=(k,t,h)=>`<div class="callout ${k}"><b class="t">${t}</b><div>${h}</div></div>`;
const COURSE={
vec:()=>[
 {id:"def",t:"Qu’est-ce qu’un vecteur ?",h:`
  <p>Un vecteur ${V("u")} est une flèche qu’on peut déplacer sans la tourner ni l’étirer. Il est caractérisé par trois éléments :</p>
  <div class="props"><div><b>Direction</b>L’orientation de la droite qui le porte (sa « pente »).</div><div><b>Sens</b>Vers où pointe la flèche, sur cette direction.</div><div><b>Norme</b>Sa longueur, notée ‖${V("u")}‖. Toujours positive ou nulle.</div></div>
  ${fig({xr:[0,9],yr:[0,6],vecs:[[1,1,4,3,"k1",""],[5,1,8,3,"k1",""],[4,6,1,4,"k2",""]],pts:[["A",1,1,"b"],["B",4,3],["C",5,1,"b"],["D",8,3],["E",4,6],["F",1,4,"l"]]},`${V("AB")} = ${V("CD")} : même direction, même sens, même norme. ${V("EF")} a la même direction et la même norme mais le sens opposé : ${V("EF")} = −${V("AB")}.`)}`},
 {id:"chasles",t:"La relation de Chasles",h:`
  <p>Pour <b>tous points</b> A, B et C :</p>
  <div class="eq">${V("AB")} + ${V("BC")} = ${V("AC")}</div>
  <p>Aller de A à B, puis de B à C, revient à aller directement de A à C.</p>
  ${fig({xr:[0,8],yr:[0,6],vecs:[[1,1,6,2,"k1",""],[6,2,3,5,"k1",""],[1,1,3,5,"k2",""]],pts:[["A",1,1,"b"],["B",6,2],["C",3,5]]},`Les deux flèches bleues mises bout à bout donnent la flèche orange ${V("AC")}.`)}
  ${callout("key","Le réflexe",`La lettre « du milieu » doit être la même : ${V("A<b>B</b>")} + ${V("<b>B</b>C")}. Elle disparaît et il reste ${V("AC")}. Ça marche avec autant de vecteurs que tu veux : ${V("AB")} + ${V("BC")} + ${V("CD")} = ${V("AD")}.`)}`},
 {id:"props",t:"Opposé, vecteur nul, commutativité",h:`
  <div class="tbl-wrap"><table><tr><th>Propriété</th><th>Écriture</th><th>En mots</th></tr>
  <tr><td><b>Opposé</b></td><td class="m">${V("BA")} = −${V("AB")}</td><td>Même direction, même norme, sens contraire.</td></tr>
  <tr><td><b>Vecteur nul</b></td><td class="m">${V("AA")} = ${V("0")}</td><td>On ne bouge pas : norme 0.</td></tr>
  <tr><td><b>Commutativité</b></td><td class="m">${V("u")} + ${V("v")} = ${V("v")} + ${V("u")}</td><td>L’ordre de l’addition ne change rien.</td></tr></table></div>
  <p>En coordonnées, on additionne composante par composante, et multiplier par un réel k multiplie chaque composante :</p>
  <div class="eq">${V("u")}(x ; y) + ${V("v")}(x' ; y') = (x + x' ; y + y')<br>k·${V("u")} = (k·x ; k·y)</div>
  ${callout("trap","Piège",`Soustraire un vecteur, c’est ajouter son opposé : ${V("AB")} − ${V("CB")} = ${V("AB")} + ${V("BC")} = ${V("AC")}.`)}`}
],
rep:()=>[
 {id:"repere",t:"Le repère (O, i, j)",h:`
  <p>Dans un repère cartésien du plan (O, ${V("i")}, ${V("j")}), tout point et tout vecteur sont définis par leurs <b>coordonnées</b> : d’abord l’abscisse x, puis l’ordonnée y.</p>
  ${fig({xr:[-1,6],yr:[-1,4],vecs:[[0,0,1,0,"k1","i"],[0,0,0,1,"k1","j"],[0,0,4,3,"k5",""]],pts:[["P(4 ; 3)",4,3]]},`Le point P a pour coordonnées (4 ; 3). Le vecteur ${V("OP")} a les mêmes composantes : (4 ; 3).`)}`},
 {id:"compo",t:"Composantes d’un vecteur AB",h:`
  <div class="eq">${V("AB")} = (x<sub>B</sub> − x<sub>A</sub> ; y<sub>B</sub> − y<sub>A</sub>)</div>
  <p>On calcule <b>arrivée moins départ</b>, pour x puis pour y.</p>
  ${callout("ex","Exemple",`A(1 ; −2) et B(4 ; 3) : ${V("AB")} = (4 − 1 ; 3 − (−2)) = (3 ; 5).`)}
  ${fig({xr:[-1,6],yr:[-3,4],vecs:[[1,-2,4,3,"k5",""]],pts:[["A",1,-2,"b"],["B",4,3]]},"On avance de 3 vers la droite et on monte de 5.")}`},
 {id:"milieu",t:"Milieu d’un segment",h:`
  <div class="eq">M = ( (x<sub>A</sub> + x<sub>B</sub>) / 2 ; (y<sub>A</sub> + y<sub>B</sub>) / 2 )</div>
  <p>C’est la <b>moyenne</b> des coordonnées : on additionne, puis on divise par 2.</p>
  ${callout("ex","Exemple","A(1 ; −2) et B(4 ; 3) : M = ((1 + 4)/2 ; (−2 + 3)/2) = (2,5 ; 0,5).")}
  ${callout("trap","Piège classique",`Ne confonds pas : le vecteur ${V("AB")} se calcule avec une <b>soustraction</b> (B − A), le milieu avec une <b>addition</b> divisée par 2.`)}`},
 {id:"norme",t:"Norme et distance",h:`
  <div class="eq">‖${V("u")}‖ = √(x² + y²)   pour ${V("u")}(x ; y)<br>d(A, B) = AB = √((x<sub>B</sub> − x<sub>A</sub>)² + (y<sub>B</sub> − y<sub>A</sub>)²)</div>
  <p>C’est le théorème de Pythagore : les composantes sont les deux côtés de l’angle droit, la norme est l’hypoténuse. La distance AB est la norme du vecteur ${V("AB")}.</p>
  ${fig({xr:[0,6],yr:[0,5],polys:[[[[1,1],[5,1],[5,4]],"k5"]],vecs:[[1,1,5,4,"k1",""]],ra:[[5,1,-1,0,0,1]],pts:[["A",1,1,"b"],["B",5,4]]},`${V("AB")}(4 ; 3) : AB = √(4² + 3²) = √25 = 5.`)}
  ${callout("ex","Exemple","A(1 ; −2) et B(4 ; 3) : AB = √(3² + 5²) = √34 ≈ 5,83.")}`},
 {id:"labo",t:"Labo : essaie avec tes propres points",h:`<p>Change les coordonnées de A et B : tout se recalcule.</p>${liveBox("rep")}`}
],
col:()=>[
 {id:"def",t:"Vecteurs colinéaires",h:`
  <p>Deux vecteurs ${V("u")} et ${V("v")} sont <b>colinéaires</b> s’il existe un réel k tel que ${V("u")} = k·${V("v")}. Ils ont alors la même direction (même sens si k &gt; 0, sens opposés si k &lt; 0).</p>
  ${fig({xr:[0,10],yr:[0,5],vecs:[[1,1,3,2,"k2","u"],[3,3,7,5,"k2","2u"],[9,4,5,2,"k1","−2u"]]},`${V("u")}, 2${V("u")} et −2${V("u")} sont colinéaires : ils sont tous parallèles.`)}`},
 {id:"critere",t:"Le critère de colinéarité",h:`
  <p>Pour ${V("u")}(x ; y) et ${V("v")}(x' ; y') :</p>
  <div class="eq">${V("u")} et ${V("v")} colinéaires  ⟺  x·y' − x'·y = 0</div>
  <p>C’est un <b>produit en croix</b> : on multiplie en diagonale, puis on soustrait.</p>
  ${callout("ex","Exemple",`${V("u")}(2 ; −3) et ${V("v")}(−4 ; 6) : 2 × 6 − (−4) × (−3) = 12 − 12 = 0. Ils sont colinéaires (en fait ${V("v")} = −2${V("u")}).`)}
  ${callout("trap","Attention aux signes","Mets toujours les nombres négatifs entre parenthèses : (−4) × (−3) = +12, donc on soustrait 12.")}`},
 {id:"applis",t:"Applications : parallélisme et alignement",h:`
  <div class="props"><div><b>Droites parallèles</b>(AB) ∥ (CD) ⟺ ${V("AB")} et ${V("CD")} colinéaires.</div><div><b>Points alignés</b>A, B, C alignés ⟺ ${V("AB")} et ${V("AC")} colinéaires.</div></div>
  ${callout("ex","Exemple",`A(1 ; 1), B(3 ; 2), C(7 ; 4). ${V("AB")}(2 ; 1), ${V("AC")}(6 ; 3). 2 × 3 − 6 × 1 = 0, donc A, B, C sont alignés.`)}
  ${fig({xr:[0,8],yr:[0,5],lines:[[1,-2,1,"k2",""]],pts:[["A",1,1,"b"],["B",3,2,"b"],["C",7,4,"b"]]},"Les trois points sont sur une même droite.")}`},

ps:()=>[

  ${fig({xr:[-2,6],yr:[-1,5],lines:[[1,-2,2,"k4","d"]],vecs:[[2,2,4,3,"k1","v"],[2,2,3,0,"k3","n"]],ra:[[2,2,2,1,1,-2]]},`d : x − 2y + 2 = 0. a = 1, b = −2 : ${V("v")}(2 ; 1) et ${V("n")}(1 ; −2).`)}
  <p>Un point appartient à la droite si ses coordonnées <b>vérifient l’équation</b>. Par exemple (2 ; 2) : 2 − 4 + 2 = 0 ✓.</p>`},

  ${fig({xr:[-1,5],yr:[0,5],polys:[[[[1,1],[4,2],[0,4]],"k6"]],vecs:[[1,1,4,2,"k6",""],[1,1,0,4,"k6",""]],ra:[[1,1,3,1,-1,3]],pts:[["A",1,1,"b"],["B",4,2],["C",0,4,"l"]]})}`},

  ${callout("trap","Les signes du produit en croix","Dans x·y' − x'·y, mets les négatifs entre parenthèses et n’oublie pas le « moins » du milieu.")}
  ${callout("trap","L’ordre des lettres",`Dans un parallélogramme ABCD, ${V("AB")} = ${V("DC")} et non ${V("CD")}.`)}`}

const GEN=[
 {id:"g:chasles",ch:"vec",t:"Relation de Chasles",d:"Simplifie une somme de vecteurs.",make(){
  const[a,b,c,d]=pick(["ABCD","MNPQ","EFGH","RSTU"]).split(""),tp=ri(0,4);let e,ans,sol;
  if(tp===0){e=`${V(a+b)} + ${V(b+c)}`;ans=a+c;sol=`La lettre du milieu (${b}) est la même : elle disparaît. ${V(a+b)} + ${V(b+c)} = ${V(a+c)}.`}
  if(tp===1){e=`${V(a+b)} + ${V(b+c)} + ${V(c+d)}`;ans=a+d;sol=`Chasles deux fois : ${V(a+b)} + ${V(b+c)} = ${V(a+c)}, puis ${V(a+c)} + ${V(c+d)} = ${V(a+d)}.`}
  if(tp===2){e=`${V(a+b)} − ${V(c+b)}`;ans=a+c;sol=`Soustraire ${V(c+b)}, c’est ajouter son opposé ${V(b+c)}. Donc ${V(a+b)} + ${V(b+c)} = ${V(a+c)}.`}
  if(tp===3){e=`${V(a+b)} + ${V(c+a)}`;ans=c+b;sol=`On change l’ordre (commutativité) : ${V(c+a)} + ${V(a+b)} = ${V(c+b)}.`}
  if(tp===4){e=`${V(a+b)} + ${V(b+a)}`;ans="0";sol=`${V(a+b)} + ${V(b+a)} = ${V(a+a)} = ${V("0")} : un vecteur plus son opposé donne le vecteur nul.`}
  const H=x=>x==="0"?`${V("0")} (vecteur nul)`:V(x);
  const L=tp===1?[a,b,c,d]:[a,b,c],pool=[];L.forEach(p=>L.forEach(q=>{if(p!==q)pool.push(p+q)}));pool.push("0");
  const rev=ans==="0"?a+c:ans[1]+ans[0];const ds=[rev,...shuffle(pool.filter(x=>x!==ans&&x!==rev))].slice(0,3);
  return{q:`Simplifie : ${e}`,choices:shuffle([ans,...ds].map(H)),ans:H(ans),sol}}},
 {id:"g:calc",ch:"vec",t:"Combinaison de vecteurs",d:"Calcule les coordonnées de α·u + β·v.",make(){

  return{q:`On donne ${V("u")}${C2(ux,uy)} et ${V("v")}${C2(vx,vy)}. Calcule les coordonnées de ${V("w")} = ${comb(al,"u",be,"v")}.`,lay:"vec",lab:V("w"),check:chkVec(wx,wy),ansTxt:C2(wx,wy),

 {id:"g:ab",ch:"rep",t:"Composantes d’un vecteur",d:"Calcule AB à partir de A et B.",make(){

 {id:"g:norm",ch:"rep",t:"Norme d’un vecteur",d:"Calcule ‖u‖ avec Pythagore.",make(){

 {id:"g:dist",ch:"rep",t:"Distance entre deux points",d:"Calcule la longueur AB.",make(){

 {id:"g:colyn",ch:"col",t:"Colinéaires ou pas ?",d:"Teste deux vecteurs avec le produit en croix.",make(){

 {id:"g:align",ch:"col",t:"Points alignés ?",d:"Teste si A, B et C sont sur une même droite.",make(){

 {id:"g:inter",ch:"met",t:"Intersection de deux droites",d:"Résous le système des deux équations.",make(){

  if(GENM[id]){const g=GENM[id],o=g.make();return Object.assign({id,ch:g.ch,label:g.t},o,o.choices?{type:"ch"}:{type:"in"})}
  const q=BANK.find(b=>b.id===id);
  if(q.t==="vf")return{id,ch:q.ch,type:"ch",q:q.q,choices:["Vrai","Faux"],ans:q.a?"Vrai":"Faux",ansTxt:q.a?"Vrai":"Faux",sol:q.exp,label:"Vrai ou faux"};
  return{id,ch:q.ch,type:"ch",q:q.q,choices:shuffle(q.c),ans:q.c[0],ansTxt:q.c[0],sol:q.exp,label:"Question de cours"};
}
function startQuiz(title,ids,mode="quiz",mins=0){
  if(!ids.length){show(`<div class="sess"><div class="card empty">Aucun exercice disponible avec ces chapitres.<br><br><a class="btn" href="#entrainement">Retour</a></div></div>`);return}
  clearInterval(TIMER);
  SESSION={kind:"quiz",title,mode,items:ids.map(inst),i:0,res:[],locked:false,end:mins?Date.now()+mins*60000:0};
  if(mins)TIMER=setInterval(tick,1000);
  renderQ();
}
function tick(){const s=SESSION;if(!s||!s.end){clearInterval(TIMER);return}const left=Math.max(0,s.end-Date.now()),el=$("#timer");
  if(el){el.textContent=`${Math.floor(left/60000)}:${pad(Math.floor(left/1000)%60)}`;el.classList.toggle("low",left<120000)}
  if(left<=0){clearInterval(TIMER);finishQuiz()}}
const inp=i=>`<input id="f${i}" autocomplete="off" inputmode="text" aria-label="Réponse ${i+1}">`;
function fieldsHtml(it){
  if(it.lay==="vec")return `<div class="ans"><span>${it.lab} (</span>${inp(0)}<span>;</span>${inp(1)}<span>)</span></div>`;
  if(it.lay==="eq")return `<div class="ans">${inp(0)}<span>x +</span>${inp(1)}<span>y +</span>${inp(2)}<span>= 0</span></div>`;
  return `<div class="ans"><span>${it.lab} =</span>${inp(0)}</div>`;
}
const nF=it=>it.lay==="vec"?2:it.lay==="eq"?3:1;
function renderQ(){
  const s=SESSION;if(s.i>=s.items.length)return finishQuiz();
  const it=s.items[s.i],c=CHM[it.ch];
  show(`<div class="sess"><div class="sess-top"><span class="t">${esc(s.title)}</span><div class="row">${s.end?`<span class="timer" id="timer">--:--</span>`:""}<span class="cnt">${s.i+1} / ${s.items.length}</span><button class="btn sm" data-a="quit">Quitter</button></div></div>
  <div class="bar"><i style="width:${100*s.i/s.items.length}%"></i></div>
  <div class="qcard" data-ch="${it.ch}"><div class="qhead"><span class="chip">${c.short}</span><span class="small muted">${it.label}</span></div><p class="qtext">${it.q}</p>
   ${it.fig?`<div class="fig"><div class="fig-sc">${it.fig}</div></div>`:""}
   ${it.type==="ch"?`<div class="choices ${it.choices.length===2?"vf":""}">${it.choices.map((ch,k)=>`<button class="choice" data-a="pick" data-k="${k}"><kbd>${k+1}</kbd><span>${ch}</span></button>`).join("")}</div>`
   :`${fieldsHtml(it)}<div class="keys" aria-label="Symboles"><button data-a="ins" data-t="−">−</button><button data-a="ins" data-t="√">√</button><button data-a="ins" data-t="/">/</button><button data-a="ins" data-t=",">,</button></div>
    <p class="hint" id="hint">${it.hint||"Écris un nombre : −3, 2,5 ou 3/2."}</p><div class="row" id="subrow"><button class="btn pri" data-a="submit">${s.mode==="exam"?"Valider":"Vérifier"}</button></div>`}
   <div id="fb"></div></div></div>`);
  if(s.end)tick();
  if(it.type==="in"){const f=$("#f0");f&&f.focus({preventScroll:true})}
}
function feedback(it,ok){
  return `<div class="fb ${ok?"ok":"ko"}"><b>${ok?"Bonne réponse":"Pas tout à fait"}</b>${ok?"":`<span>Réponse attendue : <b>${it.ansTxt}</b></span>`}<div class="sol">${it.sol}</div></div>
  <div class="foot" style="margin-top:12px"><span class="small muted">Touche Entrée pour continuer</span><button class="btn pri" data-a="next" id="nextb">${SESSION.i+1<SESSION.items.length?"Exercice suivant":"Voir le résultat"}</button></div>`;
}
function choose(k){
  const s=SESSION;if(!s||s.locked)return;const it=s.items[s.i],chosen=it.choices[k],ok=chosen===it.ans;
  s.res.push({it,given:chosen,ok});record(it.id,ok);
  if(s.mode==="exam"){s.i++;renderQ();return}
  s.locked=true;
  document.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(it.choices[j]===it.ans)b.classList.add("ok");else if(j===k)b.classList.add("ko")});
  $("#fb").innerHTML=feedback(it,ok);$("#nextb").focus({preventScroll:true});
}
function submit(){
  const s=SESSION;if(!s||s.locked)return;const it=s.items[s.i],n=nF(it),raw=[],vals=[];
  for(let i=0;i<n;i++){const v=$("#f"+i).value;raw.push(v);vals.push(parseX(v))}
  if(vals.some(v=>v===null)&&s.mode!=="exam"){const h=$("#hint");h.textContent="Remplis chaque case avec un nombre : −3, 2,5, 3/2 ou 2√5.";h.style.color="var(--bad)";return}
  const ok=!vals.some(v=>v===null)&&!!it.check(vals);
  s.res.push({it,given:raw.map(r=>r.trim()||"…").join(" ; "),ok});record(it.id,ok);
  if(s.mode==="exam"){s.i++;renderQ();return}
  s.locked=true;
  for(let i=0;i<n;i++){const f=$("#f"+i);f.readOnly=true;f.classList.add(ok?"ok":"ko")}
  $("#subrow").remove();document.querySelector(".keys").remove();$("#hint").remove();
  $("#fb").innerHTML=feedback(it,ok);$("#nextb").focus({preventScroll:true});
}
function finishQuiz(){
  clearInterval(TIMER);const s=SESSION;if(!s)return;
  s.items.slice(s.res.length).forEach(it=>{s.res.push({it,given:"(pas de réponse)",ok:false});record(it.id,false)});
  const n=s.res.filter(r=>r.ok).length,tot=s.res.length,pct=Math.round(100*n/tot);
  logSession(s.mode,s.title,n,tot,[...new Set(s.res.map(r=>r.it.ch))]);
  const by={};s.res.forEach(r=>{by[r.it.ch]=by[r.it.ch]||[0,0];by[r.it.ch][1]++;if(r.ok)by[r.it.ch][0]++});
  const wrong=s.res.filter(r=>!r.ok);SESSION={kind:"result",wrong:wrong.map(r=>r.it.id),mode:s.mode,title:s.title};
  const msg=pct>=90?"Excellent, c’est maîtrisé.":pct>=70?"Bon travail. Regarde les corrections ci-dessous.":pct>=50?"C’est un début. Relis les sections concernées, puis refais tes erreurs.":"Reprends le cours de ces chapitres avant de recommencer.";
  const note=(Math.round(n/tot*200)/10).toString().replace(".",",");
  show(`<div class="sess"><div class="sess-top"><span class="t">${esc(s.title)} · résultat</span></div>
  <div class="card stack"><div class="res-big"><b>${s.mode==="exam"?note:n}</b><span class="muted">${s.mode==="exam"?"/ 20":"/ "+tot} · ${pct} %</span></div><p>${msg}</p>
   <div class="brk">${Object.entries(by).map(([ch,v])=>`<div data-ch="${ch}"><span>${CHM[ch].short}</span><div class="bar"><i style="width:${100*v[0]/v[1]}%"></i></div><span>${v[0]}/${v[1]}</span></div>`).join("")}</div>
   <div class="row">${wrong.length?`<button class="btn pri" data-a="redo">Refaire mes ${wrong.length} erreur(s)</button>`:""}<a class="btn" href="#${s.mode==="exam"?"examen":"entrainement"}">Retour</a><a class="btn" href="#accueil">Voir ma progression</a></div></div>
  ${wrong.length?`<div class="card stack"><h3>Corrections</h3><p class="small muted">« Refaire mes erreurs » te redonne le même type d’exercice avec de nouveaux nombres.</p><div class="wrong">${wrong.map(r=>`<div><b>${r.it.q}</b>${r.it.fig?r.it.fig.replace('class="gfig"','class="gfig" style="max-width:300px;margin:0"'):""}<span class="small">Ta réponse : ${esc(r.given)} · Attendu : <b>${r.it.ansTxt}</b></span><details><summary>Voir la correction</summary><div class="sol" style="margin-top:6px;background:var(--bg)">${r.it.sol}</div></details></div>`).join("")}</div></div>`:""}</div>`);
}

/* ----- flashcards ----- */
function startFlash(list){if(!list.length)return vTrain();SESSION={kind:"flash",items:list.slice(0,15),i:0,flip:false,known:0};renderFlash()}
function renderFlash(){
  const s=SESSION;if(s.i>=s.items.length){logSession("flash","Flashcards",s.known,s.items.length,[...new Set(s.items.map(f=>f.ch))]);
    show(`<div class="sess"><div class="card stack"><div class="res-big"><b>${s.known}</b><span class="muted">/ ${s.items.length} formules sues</span></div><p>Les cartes marquées « À revoir » reviendront en priorité.</p><div class="row"><button class="btn pri" data-a="flash">Nouveau paquet</button><a class="btn" href="#entrainement">Retour</a></div></div></div>`);SESSION=null;return}
  const f=s.items[s.i];
  show(`<div class="sess"><div class="sess-top"><span class="t">Flashcards</span><div class="row"><span class="cnt">${s.i+1} / ${s.items.length}</span><button class="btn sm" data-a="quit">Quitter</button></div></div>
  <div class="bar"><i style="width:${100*s.i/s.items.length}%"></i></div>
  <div class="qcard flash" data-ch="${f.ch}" data-a="flip" role="button" tabindex="0"><span class="chip">${CHM[f.ch].short}</span><p class="front">${f.front}</p>${s.flip?`<p class="back">${f.back}</p>`:`<p class="hint">Touche la carte (ou Espace) pour voir la réponse</p>`}</div>
  ${s.flip?`<div class="row" style="justify-content:center"><button class="btn" data-a="fno">À revoir</button><button class="btn pri" data-a="fyes">Je savais</button></div>`:""}</div>`);
}

/* ================= INTERRO BLANCHE ================= */
function vExam(){
  const ex=S.log.filter(l=>l.k==="exam").slice(-5).reverse();
  show(`<div class="head"><p class="eyebrow">Conditions réelles</p><h1>Interro blanche</h1><p class="lead">20 exercices sur les six chapitres : surtout des calculs, plus quelques questions de cours. Chronomètre de 30 minutes. Pas de correction avant la fin, comme le jour de l’interro.</p></div>
  <div class="grid g2"><div class="card stack"><h3>Prêt ?</h3><ul class="small" style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px"><li>Note sur 20 à la fin, avec le détail par chapitre et toutes les corrections.</li><li>Garde un brouillon à côté de toi pour les calculs.</li><li>Tes erreurs sont ajoutées à la révision intelligente.</li></ul>
   <div class="row"><button class="btn pri" data-a="exam">Commencer l’interro</button></div></div>
   <div class="card stack"><h3>Tes dernières interros</h3>${ex.length?`<div class="hist">${ex.map(e=>`<div><span>${new Date(e.t).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"long"})}</span><span class="muted">${Math.round(100*e.s/e.tot)} %</span><b>${(Math.round(e.s/e.tot*200)/10).toString().replace(".",",")} / 20</b></div>`).join("")}</div>`:`<p class="muted small">Aucune interro pour l’instant.</p>`}</div></div>`);
}
function startExam(){let l=[];CH.forEach(c=>{l.push(...shuffle(GEN.filter(g=>g.ch===c.id)).slice(0,c.id==="met"?3:2).map(g=>g.id));l.push(pick(BANK.filter(q=>q.ch===c.id)).id)});
  l.push(pick(GEN.filter(g=>g.ch!=="met")).id);startQuiz("Interro blanche",shuffle(l).slice(0,20),"exam",30)}

/* ================= PROGRÈS ================= */
let confirmReset=false;
function vProg(){
  const h=S.log.slice(-12).reverse(),kind={quiz:"Série",exam:"Interro blanche",flash:"Flashcards"};
  show(`<div class="head"><p class="eyebrow">Suivi</p><h1>Ma progression</h1><p class="lead">Ta maîtrise par chapitre, les compétences à cocher avant l’interro et l’historique de tes séries.</p></div>
  <div class="card" style="margin-bottom:16px"><div class="tbl-wrap"><table><tr><th>Chapitre</th><th>Cours lu</th><th>Exercices</th><th>Erreurs à revoir</th><th>Total</th></tr>
  ${CH.map(c=>`<tr data-ch="${c.id}"><td><a href="#cours-${c.id}"><b>${c.short}</b></a></td><td>${chRead(c.id)}/${SECS[c.id].length}</td><td style="min-width:120px"><div class="bar"><i style="width:${Math.round(100*chMastery(c.id))}%"></i></div></td><td>${PRACT.filter(q=>q.ch===c.id&&isErr(q.id)).length}</td><td><b>${chScore(c.id)} %</b></td></tr>`).join("")}</table></div></div>
  <div class="grid g2">
   <div class="card stack"><div class="sec-title"><h3>Compétences à maîtriser</h3><span class="small muted">${SKILLS.filter(s=>S.skills[s.id]).length}/${SKILLS.length}</span></div>
   <p class="small muted">Coche une compétence quand tu sais la faire sans regarder la fiche.</p>
   <div class="skills">${SKILLS.map(s=>`<button class="skill ${S.skills[s.id]?"on":""}" data-a="skill" data-k="${s.id}" data-ch="${s.ch}"><span class="box"></span><span>${s.t} <span class="chip" style="font-size:10px;padding:1px 6px">${CHM[s.ch].short}</span></span></button>`).join("")}</div></div>
   <div class="stack">
    <div class="card chart"><h3 style="margin-bottom:10px">Scores des dernières séries</h3>${chart()}</div>
    <div class="card"><h3 style="margin-bottom:6px">Historique</h3>${h.length?`<div class="hist">${h.map(e=>`<div><span>${kind[e.k]||e.k}${e.n&&e.n!==kind[e.k]?` · <span class="muted">${esc(e.n)}</span>`:""}</span><span class="muted">${new Date(e.t).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span><b>${e.s}/${e.tot}</b></div>`).join("")}</div>`:`<p class="small muted">Aucune série pour l’instant.</p>`}</div>
    <div class="card stack"><h3>Recommencer à zéro</h3>${confirmReset?`<div class="confirm"><span class="small">Toute ta progression sera effacée. Continuer ?</span><button class="btn sm danger" data-a="resetyes">Oui, tout effacer</button><button class="btn sm" data-a="resetno">Annuler</button></div>`:`<p class="small muted">Efface les réponses, sections lues et compétences cochées.</p><div><button class="btn sm danger" data-a="reset">Effacer ma progression</button></div>`}</div>
   </div></div>`);
}

/* ================= ROUTEUR ================= */
function route(){
  clearInterval(TIMER);SESSION=null;
  const h=(location.hash||"#accueil").slice(1)||"accueil";CUR=h;renderSide();
  if(h.startsWith("cours-"))return vChapter(h.slice(6));
  ({accueil:vAccueil,cours:vCoursList,entrainement:vTrain,examen:vExam,progres:vProg}[h]||vAccueil)();
}
window.addEventListener("hashchange",route);

/* ================= ACTIONS ================= */
const genIds=chs=>GEN.filter(g=>chs.has(g.ch));
const ACT={
 read(b){const ch=b.closest("[data-ch]").dataset.ch,k=ch+"/"+b.dataset.s;if(S.read[k])delete S.read[k];else S.read[k]=1;save();b.classList.toggle("on",!!S.read[k]);b.textContent=S.read[k]?"✓ Section lue":"Marquer comme lue";
   const t=document.querySelector(`.toc a[data-s="${b.dataset.s}"]`);t&&t.classList.toggle("read",!!S.read[k])},
 jump(b,e){e.preventDefault();const el=document.getElementById("s-"+b.dataset.s);el&&el.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})},
 fil(b){const c=b.dataset.ch2;if(FIL.has(c)&&FIL.size>1)FIL.delete(c);else FIL.add(c);vTrain()},
 quiz(){startQuiz("Questions de cours",pickWeighted(BANK.filter(q=>FIL.has(q.ch)),10).map(q=>q.id))},
 quizch(b){startQuiz("Cours · "+CHM[b.dataset.ch2].short,pickWeighted(BANK.filter(q=>q.ch===b.dataset.ch2),8).map(q=>q.id))},
 genmix(){const g=genIds(FIL);const l=[];for(let i=0;i<10;i++)l.push(pickWeighted(g,Math.min(4,g.length))[Math.floor(Math.random()*Math.min(4,g.length))].id);startQuiz("Série de calculs",l)},
 genchx(b){const g=GEN.filter(x=>x.ch===b.dataset.ch2);const l=shuffle([...g,...g]).slice(0,8).map(x=>x.id);startQuiz("Exercices · "+CHM[b.dataset.ch2].short,l)},
 gengo(b){const g=GENM[b.dataset.k];startQuiz(g.t,Array(5).fill(g.id))},
 smart(){const pool=PRACT.filter(q=>FIL.has(q.ch));const e=shuffle(pool.filter(q=>isErr(q.id))),d=shuffle(pool.filter(q=>isDue(q.id))),u=shuffle(pool.filter(q=>!S.items[q.id])),r=pickWeighted(pool.filter(q=>S.items[q.id]&&!isErr(q.id)&&!isDue(q.id)),12);
   startQuiz("Révision intelligente",shuffle([...new Set([...e,...d,...u,...r].map(q=>q.id))].slice(0,12)))},
 flash(){startFlash(FLASH.filter(f=>FIL.has(f.ch)).map(f=>({f,s:mIt(f.id)+Math.random()*.7})).sort((a,b)=>a.s-b.s).map(x=>x.f))},
 flashch(b){startFlash(shuffle(FLASH.filter(f=>f.ch===b.dataset.ch2)))},
 flip(){if(SESSION&&SESSION.kind==="flash"&&!SESSION.flip){SESSION.flip=true;renderFlash()}},
 fyes(){const s=SESSION;record(s.items[s.i].id,true);s.known++;s.i++;s.flip=false;renderFlash()},
 fno(){const s=SESSION;record(s.items[s.i].id,false);s.i++;s.flip=false;renderFlash()},
 pick(b){choose(+b.dataset.k)},
 submit(){submit()},
 ins(b){const f=(LASTF&&document.body.contains(LASTF)&&!LASTF.readOnly)?LASTF:$("#f0");if(!f)return;const t=b.dataset.t,p=f.selectionStart??f.value.length;f.value=f.value.slice(0,p)+t+f.value.slice(f.selectionEnd??p);f.focus();f.setSelectionRange(p+1,p+1)},
 next(){if(SESSION&&SESSION.kind==="quiz"){SESSION.i++;SESSION.locked=false;renderQ()}},
 quit(){const back=SESSION&&SESSION.mode==="exam"?"examen":"entrainement";if(location.hash==="#"+back)route();else location.hash=back},
 redo(){startQuiz("Mes erreurs",shuffle(SESSION.wrong))},
 exam(){startExam()},
 skill(b){const k=b.dataset.k;if(S.skills[k])delete S.skills[k];else S.skills[k]=1;save();b.classList.toggle("on",!!S.skills[k]);b.closest(".card").querySelector(".sec-title .muted").textContent=`${SKILLS.filter(s=>S.skills[s.id]).length}/${SKILLS.length}`},
 reset(){confirmReset=true;vProg()},
 resetno(){confirmReset=false;vProg()},
 resetyes(){confirmReset=false;S=blank();save();vProg()}
};
document.addEventListener("pointerdown",e=>{if(e.target.closest(".keys"))e.preventDefault()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||!ACT[b.dataset.a])return;ACT[b.dataset.a](b,e)});
document.addEventListener("focusin",e=>{if(/^f\d$/.test(e.target.id))LASTF=e.target});
document.addEventListener("input",e=>{if(e.target.dataset.live)runLive(e.target.dataset.live)});
document.addEventListener("keydown",e=>{
  const s=SESSION;if(!s||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
  if(s.kind==="quiz"){
    const it=s.items[s.i];
    if(e.key==="Enter"){e.preventDefault();if(s.locked)ACT.next();else if(it&&it.type==="in"){const n=nF(it),i=/^f\d$/.test(e.target.id)?+e.target.id.slice(1):-1;if(i>=0&&i<n-1&&!e.target.value.trim()){$("#f"+(i+1)).focus()}else submit()}return}
    if(e.target.tagName==="INPUT")return;
    if(!s.locked&&it&&it.type==="ch"&&/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<it.choices.length){e.preventDefault();choose(k)}}
  }
  if(s.kind==="flash"){if(!s.flip&&(e.key===" "||e.key==="Enter")){e.preventDefault();ACT.flip()}else if(s.flip&&e.key==="ArrowRight")ACT.fyes();else if(s.flip&&e.key==="ArrowLeft")ACT.fno()}
});

route();
initCloud();
</script>
